name: Backfill

on:
  schedule:
    - cron: "0 11 * * *"   # daily; finds nothing to do once the backfill is complete
  workflow_dispatch:

concurrency: pipeline   # shares the raw layer with the weekly pipeline: never run both at once

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    env:
      BUCKET: ${{ vars.PROFAI_BUCKET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      LLM_DAILY_TOKEN_CAP: "120000"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-pipeline.txt
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          # shortcut: a scoped key (bucket raw/ + serving/ only); the account blocks OIDC without advanced features, see infra/README.md
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Pull raw layer
        run: aws s3 sync "s3://$BUCKET/raw" data/raw --only-show-errors

      - name: Extract attributes and summaries, then audit and publish
        run: python -m pipeline.backfill

      - name: Push new LLM outputs
        if: always()   # keep finished batches even if the audit fails
        run: aws s3 sync data/raw "s3://$BUCKET/raw" --only-show-errors

      - name: Publish serving data
        run: aws s3 cp data/serving.duckdb "s3://$BUCKET/serving/serving.duckdb"

      - name: Redeploy API
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
