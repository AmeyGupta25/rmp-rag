name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Lint, test, dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Dependency vulnerabilities
        run: pip install pip-audit==2.9.0 && pip-audit -r requirements-pipeline.txt
      # Scraped review text must never be committed (the repo is public). Only the synthetic
      # fixtures may contain a "comment" field.
      - name: No scraped review text in git
        run: |
          if git ls-files '*.json' '*.jsonl' ':!tests/fixtures/**' | xargs -r grep -l '"comment"'; then
            echo "::error::A committed JSON file contains review text"; exit 1
          fi
      - run: pytest -q
      # Models and data tests against committed synthetic fixtures (no real review text in git).
      - name: dbt build on fixtures
        env:
          RAW_ROOT: tests/fixtures/raw
          WAREHOUSE_PATH: ci.duckdb
        run: |
          dbt build --project-dir transform --profiles-dir transform --vars '{freshness_days: 100000, ci_fixtures: true}'

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CI: true
