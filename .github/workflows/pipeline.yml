name: Pipeline

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

concurrency: pipeline   # never two runs writing the raw layer at once

permissions:
  contents: read
  actions: write    # keepalive step re-enables scheduled workflows

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    env:
      BUCKET: ${{ vars.PROFAI_BUCKET }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX: ${{ vars.PINECONE_INDEX }}
      # Job-level so the deploy step's `if:` can see it (secrets aren't allowed in `if:`).
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-pipeline.txt
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          # shortcut: a scoped key (bucket raw/ + serving/ only); the account blocks OIDC without advanced features, see infra/README.md
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Pull raw layer
        run: aws s3 sync "s3://$BUCKET/raw" data/raw --only-show-errors

      # Extract -> validate -> dbt build + tests -> embed -> publish to data/serving.duckdb.
      # Any failed dbt test stops here, before anything reaches serving/.
      - name: Run pipeline
        run: python -m pipeline.run

      - name: Push new raw files, rejects and run logs
        if: always()   # keep extracts and the failure log even when the audit fails
        run: aws s3 sync data/raw "s3://$BUCKET/raw" --only-show-errors

      - name: Publish serving data
        run: aws s3 cp data/serving.duckdb "s3://$BUCKET/serving/serving.duckdb"

      - name: Redeploy API
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null

      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep scheduled workflows enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/freshness.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backfill.yml/enable"
